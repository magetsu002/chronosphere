name: Clippy diagnostics

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'fix/trust-and-reliability-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - name: Capture compile diagnostics
        run: |
          if [ "$(git log -1 --pretty=%s)" != "chore: capture compile diagnostics" ]; then
            echo "Diagnostic already consumed."
            exit 0
          fi
          git config user.name "Chronosphere Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          set +e
          cargo check > /tmp/check.log 2>&1
          status=$?
          set -e
          tail -n 260 /tmp/check.log > .github/COMPILE_FAILURE.txt
          git add Cargo.lock .github/COMPILE_FAILURE.txt
          git commit -m "chore: record compile diagnostics"
          git push origin HEAD:fix/trust-and-reliability-v1
          exit "$status"
