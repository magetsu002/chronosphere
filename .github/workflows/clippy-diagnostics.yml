name: Clippy diagnostics

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.head_ref == 'fix/trust-and-reliability-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - name: Refresh Cargo lockfile
        run: |
          if [ "$(git log -1 --pretty=%s)" != "chore: refresh Cargo lockfile" ]; then
            echo "Lockfile refresh already consumed."
            exit 0
          fi
          git config user.name "Chronosphere Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          cargo check
          git add Cargo.lock
          git commit -m "build: refresh Cargo lockfile"
          git push origin HEAD:fix/trust-and-reliability-v1
