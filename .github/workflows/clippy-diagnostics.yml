name: Clippy diagnostics

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/trust-and-reliability-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - name: Refresh lockfile and README
        run: |
          if [ "$(git log -1 --pretty=%s)" != "chore: refresh lockfile with Rust 1.88" ]; then
            echo "Refresh already consumed."
            exit 0
          fi
          git config user.name "Chronosphere Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          marker = 'Needs Rust ≥ 1.85 (edition 2024).'
          if marker not in text:
              raise SystemExit('README Rust marker not found')
          path.write_text(text.replace(marker, 'Needs Rust ≥ 1.88 (edition 2024).', 1))
          PY
          cargo check
          git add Cargo.lock README.md
          git commit -m "build: refresh lockfile for Rust 1.88"
          git push origin HEAD:fix/trust-and-reliability-v1
