name: Finish SSH hardening

on:
  push:
    branches: [fix/trust-and-reliability-v1]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trust-and-reliability-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Apply focused SSH fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/exec/ssh.rs")
          source = path.read_text()
          needle = "#[cfg(test)]\n\nmod tests {"
          if source.count(needle) != 1:
              raise SystemExit("expected exactly one cfg(test) blank-line occurrence")
          path.write_text(source.replace(needle, "#[cfg(test)]\nmod tests {", 1))
          PY
          rm .github/workflows/finish-ssh-hardening.yml
          cargo fmt --check
          git config user.name "Chronosphere Hardening"
          git config user.email "actions@users.noreply.github.com"
          git add src/exec/ssh.rs .github/workflows/finish-ssh-hardening.yml
          git commit -m "fix: finish ssh deployment hardening"
          git push origin HEAD:fix/trust-and-reliability-v1
