name: Hardening bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: chronosphere-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: false

