name: Integrate latest main

on:
  push:
    branches: [fix/trust-and-reliability-v1]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trust-and-reliability-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Merge latest main or publish conflict report
        shell: bash
        run: |
          git config user.name "Chronosphere Hardening"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main > /tmp/merge.log 2>&1
          status=$?
          set -e
          cat /tmp/merge.log
          if [ "$status" -ne 0 ]; then
            mkdir -p .github
            git diff --name-only --diff-filter=U > /tmp/conflict-names.txt
            git diff --cc > /tmp/conflict.patch
            git merge --abort
            {
              echo "Latest main: $(git rev-parse origin/main)"
              echo "Branch before merge: $(git rev-parse HEAD)"
              echo
              cat /tmp/conflict-names.txt
            } > .github/main-merge-conflicts.txt
            cp /tmp/conflict.patch .github/main-merge-conflicts.patch
            rm .github/workflows/integrate-main.yml
            git add .github/main-merge-conflicts.txt .github/main-merge-conflicts.patch .github/workflows/integrate-main.yml
            git commit -m "chore: capture latest main merge conflicts"
            git push origin HEAD:fix/trust-and-reliability-v1
            exit 0
          fi

          rm .github/workflows/integrate-main.yml
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D clippy::correctness -D clippy::suspicious
          cargo test --locked --all-targets
          cargo build --locked --release
          git add -A
          git commit -m "merge: integrate latest main before hardening closeout"
          git push origin HEAD:fix/trust-and-reliability-v1
