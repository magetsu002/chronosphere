name: Milestone 1 context safety

on:
  push:
    branches: [fix/trust-and-reliability-v2]

permissions:
  contents: write

jobs:
  milestone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trust-and-reliability-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt
      - name: Apply and validate context safety
        shell: bash
        run: |
          START=$(git rev-parse HEAD)
          git config user.name "Chronosphere Hardening"
          git config user.email "actions@users.noreply.github.com"
          set +e
          (
            set -euo pipefail
            git fetch origin fix/trust-and-reliability-v1
            set +e
            git cherry-pick --no-commit -X ours a74ff8e7bd47abc5e2471d90f58fb767509ac37a
            pick_status=$?
            set -e
            if [ "$pick_status" -ne 0 ]; then
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                git checkout --ours -- "$path" 2>/dev/null || git rm -f -- "$path"
              done < <(git diff --name-only --diff-filter=U)
              git add -A
              git cherry-pick --quit
            fi
            test -z "$(git diff --name-only --diff-filter=U)"

            python3 - <<'PY'
            from pathlib import Path

            path = Path("src/cli.rs")
            source = path.read_text()
            source = source.replace(
                '    Engagement::load(root.join(&pick)).with_context(|| format!("load engagement {}", pick))',
                '    Engagement::load_named(root, &pick).with_context(|| format!("load engagement {}", pick))',
            )
            old = '''    if let Some(name) = engagement {
                let dir = root.join(name);'''
            new = '''    if let Some(name) = engagement {
                Engagement::validate_name(name)?;
                let dir = root.join(name);'''
            if old in source:
                source = source.replace(old, new, 1)

            start = source.index("fn build_context(")
            end = source.index("\nfn resolve(", start)
            replacement = '''fn build_context(
                engagement: &Engagement,
                target_override: &Option<String>,
                ap_override: &Option<String>,
                cred_override: &Option<String>,
                extra_vars: &[String],
            ) -> Result<RenderContext> {
                let mut ctx = RenderContext::default();
                let target = match target_override.as_deref() {
                    Some(name) => Some(
                        engagement
                            .targets
                            .targets
                            .iter()
                            .find(|target| target.name == name)
                            .ok_or_else(|| anyhow!("no target named {}", name))?,
                    ),
                    None => engagement.targets.active(),
                };
                if let Some(target) = target {
                    ctx.target = Some(target.clone());
                }

                let ap = match ap_override.as_deref() {
                    Some(name) => Some(
                        engagement
                            .aps
                            .aps
                            .iter()
                            .find(|ap| ap.name == name)
                            .ok_or_else(|| anyhow!("no access point named {}", name))?,
                    ),
                    None => engagement.aps.active(),
                };
                if let Some(ap) = ap {
                    ctx.ap = Some(ap.clone());
                }

                let profile = match cred_override.as_deref() {
                    Some(name) => Some(
                        engagement
                            .profiles
                            .profiles
                            .iter()
                            .find(|profile| profile.name == name)
                            .ok_or_else(|| anyhow!("no credential profile named {}", name))?,
                    ),
                    None => engagement.profiles.active(),
                };
                if let Some(profile) = profile {
                    ctx.profile = Some(profile.clone());
                }

                ctx.pivot_tunnel = engagement.pivots.active_tunnel().cloned();
                ctx.pivot_remote = engagement.pivots.active_remote().cloned();
                ctx.execution_mode = engagement.pivots.execution_mode;
                ctx.engagement_dir = Some(engagement.dir.clone());
                ctx.globals = engagement.variables.values.clone();
                for value in extra_vars {
                    if let Some((key, value)) = value.split_once('=') {
                        ctx.globals
                            .insert(key.trim().to_string(), value.to_string());
                    }
                }
                Ok(ctx)
            }
            '''
            source = source[:start] + replacement + source[end:]
            old_call = '''    let ctx = build_context(
                &e,
                target_override,
                ap_override,
                cred_override,
                extra_vars,
            );'''
            new_call = '''    let ctx = build_context(
                &e,
                target_override,
                ap_override,
                cred_override,
                extra_vars,
            )?;'''
            if old_call in source:
                source = source.replace(old_call, new_call, 1)
            elif new_call not in source:
                raise SystemExit("resolve context call not found")
            path.write_text(source)
            PY

            rm -f .github/v1-commit-log.txt .github/workflows/milestone-1-context.yml
            cargo fmt
            cargo fmt --check
            cargo check --locked
            cargo test --locked --all-targets
            git add -A
            git commit -m "fix: enforce explicit and safe execution context"
          ) > /tmp/milestone-1.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/milestone-1.log /tmp/milestone-1.saved.log
            git reset --hard "$START"
            rm -f .github/v1-commit-log.txt .github/workflows/milestone-1-context.yml
            cp /tmp/milestone-1.saved.log .github/milestone-1-failure.log
            git add -A
            git commit -m "chore: capture milestone 1 failure"
          fi
          git push origin HEAD:fix/trust-and-reliability-v2
