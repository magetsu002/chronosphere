name: Finalize hardening branch

on:
  push:
    branches: [chore/trust-reliability-closeout]

permissions:
  contents: write

concurrency:
  group: chronosphere-hardening-closeout
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/trust-reliability-closeout
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - name: Build validated seven-commit branch
        run: python3 .github/finalize_hardening.py
