name: Hardening diagnostics

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'fix/trust-and-reliability-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Publish compile gap fix
        run: |
          if [ "$(git log -1 --pretty=%s)" != "chore: publish compile gap fix" ]; then
            echo "Publisher already consumed."
            exit 0
          fi
          git config user.name "Chronosphere Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          job_log = Path('src/ui/modals/job_log.rs')
          text = job_log.read_text()
          old = 'use crate::engagement::{JobRecord, JobStatus};'
          if old not in text:
              raise SystemExit('job log import marker not found')
          text = text.replace(old, 'use crate::engagement::JobRecord;', 1)
          marker = '    use crate::app::JobLogModal;\n'
          if marker not in text:
              raise SystemExit('job log test marker not found')
          text = text.replace(
              marker,
              marker + '    use crate::engagement::JobStatus;\n',
              1,
          )
          job_log.write_text(text)

          context = Path('src/render/context.rs')
          text = context.read_text()
          first = '            /// Hostname-first address for HTTP URLs (e.g. sub1.target.htb); falls back to IP.'
          second = '            /// Root domain for vhost/subdomain fuzz (e.g. target.htb). Override with -v vhost_root=...'
          if first not in text or second not in text:
              raise SystemExit('render context comment markers not found')
          text = text.replace(first, first.replace('///', '//', 1), 1)
          text = text.replace(second, second.replace('///', '//', 1), 1)
          context.write_text(text)
          PY
          git add src/ui/modals/job_log.rs src/render/context.rs
          git commit -m "fix: close job status compile gaps"
          git push origin HEAD:fix/trust-and-reliability-v1
