name: Hardening diagnostics

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/trust-and-reliability-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt
      - name: Format source and refresh README
        run: |
          if [ "$(git log -1 --pretty=%s)" != "chore: format hardening branch" ]; then
            echo "Formatter already consumed."
            exit 0
          fi
          git config user.name "Chronosphere Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          replacements = {
              'Needs Rust ≥ 1.83 (edition 2024).':
                  'Needs Rust ≥ 1.85 (edition 2024).',
              '- **Local CVE index** with FTS5 + optional embeddings for description search.':
                  '- **Optional semantic CVE search** on top of the implemented local FTS5 index.',
              '| engagements | `~/.local/share/chronosphere/engagements/` (Linux) or `~/Library/Application Support/chronosphere/engagements/` (macOS) |':
                  '| engagements | `<current directory>/engagements/` by default, or the directory passed with `--root` |',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'README marker not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt
          git add README.md Cargo.toml Cargo.lock src
          git commit -m "style: format hardening changes"
          git push origin HEAD:fix/trust-and-reliability-v1
