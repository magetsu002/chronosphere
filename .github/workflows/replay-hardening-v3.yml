name: Replay hardening milestones V3

on:
  push:
    branches: [fix/trust-and-reliability-v3]

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trust-and-reliability-v3
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - name: Restore deterministic runner
        run: |
          git show ebcf539d483f13c1a6905ff62a807be18a17489b:.github/replay_hardening_v3.py > /tmp/replay_hardening_v3.py
          sed -i 's/v3-replay-failure\.log/v3-replay-failure.txt/' /tmp/replay_hardening_v3.py
          python3 .github/fix_replay_v3_context.py
      - name: Replay, validate, and publish milestones
        run: python3 /tmp/replay_hardening_v3.py
