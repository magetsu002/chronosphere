name: Build job recovery milestones

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: chronosphere-job-recovery-bootstrap
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/job-recovery-bootstrap
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - name: Build and validate milestones
        shell: bash
        run: |
          base64 -d .github/job_recovery_impl.py.gz.b64 | gzip -d > /tmp/job_recovery_impl.py
          set +e
          python3 /tmp/job_recovery_impl.py > /tmp/job-recovery.log 2>&1
          status=$?
          set -e
          cat /tmp/job-recovery.log
          exit "$status"
