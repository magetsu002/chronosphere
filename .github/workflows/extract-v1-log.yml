name: Extract V1 milestone log

on:
  push:
    branches: [fix/trust-and-reliability-v2]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trust-and-reliability-v2
          fetch-depth: 0
          persist-credentials: true
      - run: |
          git config user.name "Chronosphere Hardening"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin fix/trust-and-reliability-v1
          git log --reverse --format='%H %s' 3587c6eb5ae5bdafadeee7dc7e742c29491816a1..origin/fix/trust-and-reliability-v1 > .github/v1-commit-log.txt
          rm -f .github/v2-smoke-ok.txt .github/workflows/extract-v1-log.yml
          git add .github/v1-commit-log.txt .github/v2-smoke-ok.txt .github/workflows/extract-v1-log.yml
          git commit -m "chore: capture hardening milestone commit map"
          git push origin HEAD:fix/trust-and-reliability-v2
